meta:
  name: "U-Muc 1.05\""
  description: "U-Bahn München, 240×240px, 1.05 Zoll, Bahnhofsuhr mit laufendem Sekundenzeiger"
  author: "christoph"
  version: "2.3"
  canvas:
    width: 240
    height: 240
  timezone: "Europe/Berlin"
  animation:
    frames: 60        # eine Minute …
    frame_delay: 1    # … in Sekundenschritten, danach von vorn
    loop: true

fonts:
  - id: bold
    file: Roboto-Bold.ttf
  - id: regular
    file: RobotoCondensed-Regular.ttf

# Aufbau wie legacy/umuc-105-v1/index.php: Gezeichnet wird die obere
# Bildhälfte (links Uhr + Gleis, rechts Abfahrtsliste); zwei copy-Layer am
# Ende setzen sie vertauscht in die untere Hälfte. Alles vor den copy-Layern
# — auch die Uhrzeiger — erscheint deshalb zweimal.
# Schriftgrößen: v2.1 Zeilen 13 und Gleis 18 (je +1 gegenüber Legacy × 4/3),
# Kopfzeile bleibt 10 (sonst stößt der Hinweis an „Min.");
# Positionen = Oberkante der Schrift.
# v2.2: Alle Texte werden wie im PHP doppelt an derselben Stelle gezeichnet,
# damit die Kantenglättung dichter wird und die Schrift nicht verwäscht.
# Zieltexte sitzen 1 px höher als Linien-Text (y 35 / 61 / 87).
# v2.3: Zieltexte mit scale_x 0.88 gestaucht, damit lange Ziele nicht in
# zweistellige Minuten laufen.
# Linien-Badges: file ist aus Sicherheitsgründen nicht interpolierbar, daher
# je Zeile eine if/elif-Kette über U1–U8; jede andere Linie (auch leer)
# landet im else-Block als Text.
# Spalte „Min.": wie im Original relativ zu Zug 1, der fest mit 5 Minuten
# angezeigt wird; mod(1440) hält den Wert über Mitternacht positiv.
# Leere oder ungültige Zeiten ergeben eine leere Zelle.

layers:
  # Hintergrund mit Zifferblatt, Logo und Notruf-Schild
  - type: image
    file: bg.png
    x: 0
    y: 0

  # Uhr: Zifferblatt-Mitte (39,56). Zeiger-PNGs 70×70, Drehpunkt = Bildmitte,
  # bei 0° nach oben; rotate dreht im Uhrzeigersinn, x/y = Drehpunkt.
  - type: image
    file: clock-hour.png
    x: 39
    y: 56
    rotate: "{{now.hour12 | mul(30) | add(now.minute | div(2))}}"

  - type: image
    file: clock-minutes.png
    x: 39
    y: 56
    rotate: "{{now.minute | mul(6)}}"

  - type: image
    file: clock-seconds.png
    x: 39
    y: 56
    rotate: "{{now.second | mul(6)}}"

  # Kopfzeile der Abfahrtsliste (doppelt)
  - type: text
    value: "{{zug1.hinweis}}"
    x: 142
    y: 19
    font: regular
    size: 10
    color: "#ffffff"
  - type: text
    value: "{{zug1.hinweis}}"
    x: 142
    y: 19
    font: regular
    size: 10
    color: "#ffffff"

  - type: text
    value: "Min."
    x: 222
    y: 19
    font: regular
    size: 10
    color: "#ffffff"
  - type: text
    value: "Min."
    x: 222
    y: 19
    font: regular
    size: 10
    color: "#ffffff"

  # Gleis unter der Uhr (doppelt)
  - type: text
    value: "Gleis {{gleis}}"
    x: 38
    y: 95
    font: bold
    size: 18
    color: "#ffffff"
    align: center
  - type: text
    value: "Gleis {{gleis}}"
    x: 38
    y: 95
    font: bold
    size: 18
    color: "#ffffff"
    align: center

  # --- Zug 1 (Zeile y 36) ---
  - type: image
    if: "equals(zug1.nr, 'U1')"
    file: U1.png
    x: 120
    y: 36
  - type: image
    elif: "equals(zug1.nr, 'U2')"
    file: U2.png
    x: 120
    y: 36
  - type: image
    elif: "equals(zug1.nr, 'U3')"
    file: U3.png
    x: 120
    y: 36
  - type: image
    elif: "equals(zug1.nr, 'U4')"
    file: U4.png
    x: 120
    y: 36
  - type: image
    elif: "equals(zug1.nr, 'U5')"
    file: U5.png
    x: 120
    y: 36
  - type: image
    elif: "equals(zug1.nr, 'U6')"
    file: U6.png
    x: 120
    y: 36
  - type: image
    elif: "equals(zug1.nr, 'U7')"
    file: U7.png
    x: 120
    y: 36
  - type: image
    elif: "equals(zug1.nr, 'U8')"
    file: U8.png
    x: 120
    y: 36
  - else: true
    layers:
      - type: text
        value: "{{zug1.nr}}"
        x: 121
        y: 36
        font: regular
        size: 13
        color: "#ffffff"
      - type: text
        value: "{{zug1.nr}}"
        x: 121
        y: 36
        font: regular
        size: 13
        color: "#ffffff"
  - type: text
    value: "{{zug1.vonnach}}"
    x: 143
    y: 35
    font: regular
    size: 13
    scale_x: 0.88
    color: "#ffffff"
  - type: text
    value: "{{zug1.vonnach}}"
    x: 143
    y: 35
    font: regular
    size: 13
    scale_x: 0.88
    color: "#ffffff"
  - type: text
    value: "{{zug1.zeit | minutes | sub(zug1.zeit | minutes) | mod(1440) | add(5)}}"
    x: 238
    y: 35
    font: regular
    size: 13
    color: "#ffffff"
    align: right
  - type: text
    value: "{{zug1.zeit | minutes | sub(zug1.zeit | minutes) | mod(1440) | add(5)}}"
    x: 238
    y: 35
    font: regular
    size: 13
    color: "#ffffff"
    align: right

