  - type: text
    value: "{{zug3.zeit | minutes | sub(zug1.zeit | minutes) | mod(1440) | add(5)}}"
    x: 238
    y: 88
    font: regular
    size: 12
    color: "#ffffff"
    align: right

  # Untere Hälfte: Abfahrtsliste nach links unten …
  - type: copy
    src_x: 120
    src_y: 18
    src_width: 120
    src_height: 96
    x: 0
    y: 138

  # … Uhr und Gleis nach rechts unten
  - type: copy
    src_x: 0
    src_y: 18
    src_width: 77
    src_height: 102
    x: 162
    y: 138
