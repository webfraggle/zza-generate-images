    align: right

  # --- Zug 3 (Zeile y 89) ---
  - type: image
    if: "equals(zug3.nr, 'U1')"
    file: U1.png
    x: 120
    y: 88
  - type: image
    elif: "equals(zug3.nr, 'U2')"
    file: U2.png
    x: 120
    y: 88
  - type: image
    elif: "equals(zug3.nr, 'U3')"
    file: U3.png
    x: 120
    y: 88
  - type: image
    elif: "equals(zug3.nr, 'U4')"
    file: U4.png
    x: 120
    y: 88
  - type: image
    elif: "equals(zug3.nr, 'U5')"
    file: U5.png
    x: 120
