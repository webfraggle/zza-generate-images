meta:
  name: "Zuglaufschild 1.05\""
  description: "Zuglaufschild Epoche III/IV, weiße Emailtafel mit schwarzer Schrift, 240×240px, 1.05 Zoll, Gleistafel außen"
  author: ""
  version: "1.0"
  instructions: |
    Emailschild im Stil der Epoche III/IV, ganz ohne Elektronik-Optik.
    Zeigt nur zug1: Abfahrtszeit (mit Punkt, z.B. 15.54), Zugnummer, Ziel
    und die Unterwegshalte hinter "über". Verspätung (abw) und Hinweis
    erscheinen als rote Einsteckschilder. Mit Hinweis ist die Via-Zeile
    einzeilig, ohne Hinweis darf sie zwei Zeilen haben.
    zug2 und zug3 werden nicht angezeigt.
  canvas:
    width: 240
    height: 240

# Seite A = obere Hälfte (y 0–119), Seite B = untere Hälfte (y 120–239).
# Rahmen #2e3134, Emailweiß #f5f2e8, Schwarz #111111, Rot #c8161d.
# Oben:  Rand 2 | Gleistafel x 2–41 | Lücke 2 | Zugtafel x 44–237 | Rand 2
# Unten: Rand 2 | Zugtafel x 2–195  | Lücke 2 | Gleistafel x 198–237 | Rand 2
# Textbereich der Zugtafel: x 55–226 (172 px), neben den Schraublöchern.

fonts:
  - id: bold
    file: NimbusSanL-Bol.otf
  - id: regular
    file: NimbusSanL-Reg.otf

layers:
  # ---------- Obere Hälfte = Seite A ----------
  - type: rect                     # Rahmen
    x: 0
    y: 0
    width: 240
    height: 120
    color: "#2e3134"

  - type: image                    # Gleistafel außen
    file: schild-gleis.png
    x: 2
    y: 2

  - type: image                    # Zugtafel
    file: schild-ziel.png
    x: 44
    y: 2

  # Parken: unterer Streifen der Zugtafel samt Rahmen (y 101–119) unberührt
  # in die noch leere untere Hälfte legen (y 130–148). Er wird zweimal
  # zurückkopiert und schneidet Text ab, der zu weit nach unten läuft.
  - type: copy
    src_x: 44
    src_y: 101
    src_width: 194
    src_height: 19
    x: 0
    y: 130

  # ----- Gleistafel -----
  - type: text
    value: "Gleis"
    x: 22
    y: 33
    font: regular
    size: 10
    color: "#111111"
    align: center

  - type: text
    value: "{{gleis}}"
    x: 22
    y: 45
    font: bold
    size: 30
    scale_x: 0.85
    color: "#111111"
    align: center

  # ----- Kopfzeile: Zeit, Verspätungsschild, Zugnummer -----
  - type: text
    id: zeit
    advance: 6
    value: "{{zug1.zeit | replace(':', '.')}}"
    x: 55
    y: 8
    font: bold
    size: 17
    color: "#111111"

  - if: "greaterThan(zug1.abw, 0)"
    layers:
      - type: text                 # unsichtbar (Tafelfarbe), misst nur die Breite
        id: abw
        value: "+{{zug1.abw}} Min."
        x: "{{zeit.end + 3}}"
        y: 12
        font: bold
        size: 11
        color: "#f5f2e8"
      - type: rect                 # rotes Einsteckschild
        x: "{{zeit.end}}"
        y: 10
        width: "{{abw.width + 6}}"
        height: 14
        color: "#c8161d"
      - type: text
        value: "+{{zug1.abw}} Min."
        x: "{{zeit.end + 3}}"
        y: 12
        font: bold
        size: 11
        color: "#ffffff"

  - type: text
    value: "{{zug1.nr}}"
    x: 137
    y: 9
    width: 89
    font: bold
    size: 15
    scale_x: 0.85
    color: "#111111"
    align: right

  - type: rect                     # Trennlinie
    x: 55
    y: 28
    width: 172
    height: 1
    color: "#111111"

  # ----- Ziel: bis zu 2 Zeilen, unten ausgerichtet (steht direkt über "über") -----
  - type: text
    value: "{{zug1.vonnach}}"
    x: 55
    y: 31
    width: 172
    height: 42
    valign: bottom
    line_height: 0.85
    font: bold
    size: 19
    scale_x: 0.7
    color: "#111111"

  # ----- Via -----
  # Mit Hinweis: eine Zeile, Halte, die nicht passen, entfallen.
  - type: text
    if: "and(not(isEmpty(zug1.via)), not(isEmpty(zug1.hinweis)))"
    value: "über {{zug1.via}}"
    x: 55
    y: 75
    font: regular
    size: 12
    scale_x: 0.85
    max_width: 172
    color: "#111111"
    fit_items:
      split_by: " - "
      gap: 6

  # Ohne Hinweis: Umbruch, zwei Zeilen sichtbar.
  - type: text
    elif: "not(isEmpty(zug1.via))"
    value: "über {{zug1.via}}"
    x: 55
    y: 75
    font: regular
    size: 12
    scale_x: 0.85
    max_width: 172
    color: "#111111"

  # Zurückkopieren: schneidet alles unterhalb der zweiten Via-Zeile ab.
  - type: copy
    src_x: 0
    src_y: 130
    src_width: 194
    src_height: 19
    x: 44
    y: 101

  # ----- Hinweis: rotes Einsteckschild, zwei Zeilen -----
  - if: "not(isEmpty(zug1.hinweis))"
    layers:
      - type: rect
        x: 49
        y: 89
        width: 184
        height: 24
        color: "#c8161d"
      - type: text
        value: "{{zug1.hinweis}}"
        x: 53
        y: 90
        width: 176
        height: 22
        valign: middle
        line_height: 0.9
        font: bold
        size: 11
        scale_x: 0.62
        color: "#ffffff"

  # Zurückkopieren, nur der Teil unter dem Hinweisschild (y 113–119):
  # schneidet eine dritte Hinweiszeile ab.
  - type: copy
    src_x: 0
    src_y: 142
    src_width: 194
    src_height: 7
    x: 44
    y: 113

  # ---------- Untere Hälfte = Seite B, gespiegelt ----------
  - type: rect                     # Rahmen (überschreibt auch die Parkfläche)
    x: 0
    y: 120
    width: 240
    height: 120
    color: "#2e3134"

  - type: copy                     # Zugtafel nach links: x 44–237 -> x 2–195
    src_x: 44
    src_y: 2
    src_width: 194
    src_height: 116
    x: 2
    y: 122

  - type: copy                     # Gleistafel nach rechts außen: x 2–41 -> x 198–237
    src_x: 2
    src_y: 2
    src_width: 40
    src_height: 116
    x: 198
    y: 122
