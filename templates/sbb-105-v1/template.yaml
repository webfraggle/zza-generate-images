meta:
  name: "SBB 1.05\""
  description: "Schweizer Bundesbahnen, 1.05 Zoll Display"
  author: "christoph"
  version: "2.0"
  canvas:
    width: 240
    height: 240

fonts:
  - id: bold
    file: NimbusSanL-Bol.otf
  - id: regular
    file: NimbusSanL-Reg.otf
  - id: italic
    file: NimbusSanL-RegIta.otf

# Aufbau wie legacy/sbb-105-v1/index.php: Gezeichnet wird die obere Bildhälfte
# (y 0–120); ein copy-Layer am Ende setzt sie nach y 120.
# Schriftgrößen = Legacy-Größe × 16/9. Das PHP setzt die linke obere Ecke der
# Tinte auf (x,y) (bzw. bei vonnach die linke untere); die Go-Engine rechnet mit
# der Grundlinie. Die y-Werte sind deshalb gegen die PHP-Ausgabe abgeglichen.
# Abweichungen zum PHP:
# - Wiederholte Layer: Das PHP zeichnet die meisten Texte zweimal übereinander
#   (deckendere Kantenglättung); das Template auch.
# - vonnach ist an der Grundlinie der letzten Zeile verankert. Das PHP verankert
#   die Unterkante der Tinte, dadurch springt ein Ziel ohne Unterlänge (z. B.
#   "Chur") dort ein paar Pixel tiefer als eines mit ("Kyburg").
# - Info-Modus: Das PHP bricht den Hinweis mit der fetten Schrift um, zeichnet
#   ihn aber normal; hier wird mit der normalen Schrift gemessen (max_width
#   entsprechend kleiner gewählt).
# - Das PHP wandelt vonnach nach ISO-8859-1; hier entfällt das (UTF-8).
# - Zugnummer: Das PHP fügt alle Ziffern von nr zusammen ("IC 8 12" → 812),
#   hier zählt die erste Ziffernfolge (→ 8).
# - Via: Leere Elemente (z. B. "A - - B") überspringt die Engine; das PHP
#   zeichnet dafür einen Punkt ohne Text.
#
# Info-Modus (PHP: $mode = "infoOnly"): abw ("" oder "0"), vonnach, nr und via leer —
# dann nur der Hinweis groß in Gelb, ohne Abfahrtszeit.

layers:
  # Hintergrund
  - type: image
    file: bg.png
    x: 0
    y: 0

  # ── Info-Modus: nur Hinweis ─────────────────────────────────────────────────
  - if: "and(or(isEmpty(zug1.abw | trim), equals(zug1.abw | trim, '0')), isEmpty(zug1.vonnach | trim), isEmpty(zug1.nr | trim), isEmpty(zug1.via | trim))"
    layers:
      - type: text
        value: "{{zug1.hinweis | trim}}"
        x: 5
        y: 62
        valign: baseline
        font: regular
        size: 22.67
        line_height: 0.75
        max_width: 140
        color: "#fff048"
      - type: text
        value: "{{zug1.hinweis | trim}}"
        x: 4
        y: 62
        valign: baseline
        font: regular
        size: 22.67
        line_height: 0.75
        max_width: 140
        color: "#fff048"

  # ── Normalfall ──────────────────────────────────────────────────────────────
  - else: true
    layers:
      # Abfahrtszeit
      - type: text
        value:
          if: "contains(zug1.zeit, ':')"
          then: "{{zug1.zeit | match('^[^:]*:[^:]*', 0)}}"
          else: "{{zug1.zeit}}"
        x: 4
        y: 31
        valign: baseline
        font: bold
        size: 21.33
        color: "#ffffff"

      # Hinweis: roter Balken, Text weiß, zweizeilig
      - if: "not(isEmpty(zug1.hinweis | trim))"
        layers:
          - type: rect
            x: 3
            y: 78
            width: 117
            height: 30
            color: "#ff0000"
          - type: text
            value: "{{zug1.hinweis | trim}}"
            x: 5
            y: 91
            valign: baseline
            font: regular
            size: 14.67
            line_height: 0.75
            max_width: 111
            color: "#ffffff"
          - type: text
            value: "{{zug1.hinweis | trim}}"
            x: 5
            y: 91
            valign: baseline
            font: regular
            size: 14.67
            line_height: 0.75
            max_width: 111
            color: "#ffffff"

  # Ziel (vonnach), unten verankert: über dem Hinweis bzw. am Feldende
  - if: "not(isEmpty(zug1.hinweis | trim))"
    layers:
      - type: text
        value: "{{zug1.vonnach | replace('/', '/ ')}}"
        x: 5
        y: 0
        width: 111
        height: 76
        valign: bottom
        font: regular
        size: 21.07
        line_height: 0.75
        color: "#ffffff"
      - type: text
        value: "{{zug1.vonnach | replace('/', '/ ')}}"
        x: 5
        y: 0
        width: 111
        height: 76
        valign: bottom
        font: regular
        size: 21.07
        line_height: 0.75
        color: "#ffffff"
  - else: true
    layers:
      - type: text
        value: "{{zug1.vonnach | replace('/', '/ ')}}"
        x: 5
        y: 0
        width: 111
        height: 100
        valign: bottom
        font: regular
        size: 21.07
        line_height: 0.75
        color: "#ffffff"
      - type: text
        value: "{{zug1.vonnach | replace('/', '/ ')}}"
        x: 5
        y: 0
        width: 111
        height: 100
        valign: bottom
        font: regular
        size: 21.07
        line_height: 0.75
        color: "#ffffff"

  # Via: gepunktete Linie + bis zu 5 Stationen (an "-" geteilt)
  - type: image
    if: "not(isEmpty(zug1.via | trim))"
    file: dottet-line.png
    x: 129
    y: 13

  - type: loop
    if: "not(isEmpty(zug1.via | trim))"
    value: "{{zug1.via}}"
    split_by: "-"
    var: via
    max_items: 5
    layers:
      - type: image
        file: dot.png
        x: 126
        y: "{{i * 16 + 22}}"
      - type: text
        value: "{{via | trim}}"
        x: 141
        y: "{{i * 16 + 31}}"
        valign: baseline
        font: regular
        size: 13.33
        color: "#ffffff"
      - type: text
        value: "{{via | trim}}"
        x: 141
        y: "{{i * 16 + 31}}"
        valign: baseline
        font: regular
        size: 13.33
        color: "#ffffff"

  # ── Verspätung ──────────────────────────────────────────────────────────────
  # Mit Hinweis: blaues Feld an der Stelle der Zuggattung (die dann entfällt).
  # Ohne Hinweis: unter der Abfahrtszeit, Zuggattung bleibt.
  - if: "greaterThan(zug1.abw | trim, 0)"
    layers:
      - if: "not(isEmpty(zug1.hinweis | trim))"
        layers:
          - type: rect
            x: 65
            y: 17
            width: 53
            height: 14
            color: "#132a9b"
          - type: text
            value: "+{{zug1.abw | round}}'"
            x: 69
            y: 31
            valign: baseline
            font: bold
            size: 21.33
            color: "#fff048"
      - else: true
        layers:
          - type: text
            value: "+{{zug1.abw | round}}'"
            x: 6
            y: 52
            valign: baseline
            font: bold
            size: 21.33
            color: "#fff048"

  # ── Zuggattung (nur wenn nicht durch die Verspätung verdeckt) ──────────────
  # Reihenfolge wie im PHP; Vergleiche ohne Groß-/Kleinschreibung.
  # Typ = erste Buchstabengruppe von nr, Nummer = Ziffern von nr.
  - if: "not(and(greaterThan(zug1.abw | trim, 0), not(isEmpty(zug1.hinweis | trim))))"
    layers:
      # IC (nicht ICE/ICN)
      - if: "and(startsWith(zug1.nr | lower, 'ic'), not(startsWith(zug1.nr | lower, 'ice')), not(startsWith(zug1.nr | lower, 'icn')))"
        layers:
          - type: image
            file: ic.png
            x: 71
            y: 17
          - type: text
            value: "{{zug1.nr | match('[0-9]+', 0)}}"
            x: 96
            y: 28
            valign: baseline
            font: regular
            size: 13.87
            color: "#ffffff"
          - type: text
            value: "{{zug1.nr | match('[0-9]+', 0)}}"
            x: 96
            y: 28
            valign: baseline
            font: regular
            size: 13.87
            color: "#ffffff"
      # EC
      - elif: "startsWith(zug1.nr | lower, 'ec')"
        layers:
          - type: image
            file: ec.png
            x: 65
            y: 17
          - type: text
            value: "{{zug1.nr | match('[0-9]+', 0)}}"
            x: 96
            y: 28
            valign: baseline
            font: regular
            size: 13.87
            color: "#ffffff"
          - type: text
            value: "{{zug1.nr | match('[0-9]+', 0)}}"
            x: 96
            y: 28
            valign: baseline
            font: regular
            size: 13.87
            color: "#ffffff"
      # ICN
      - elif: "startsWith(zug1.nr | lower, 'icn')"
        layers:
          - type: image
            file: icn.png
            x: 71
            y: 17
          - type: text
            value: "{{zug1.nr | match('[0-9]+', 0)}}"
            x: 96
            y: 28
            valign: baseline
            font: regular
            size: 13.87
            color: "#ffffff"
          - type: text
            value: "{{zug1.nr | match('[0-9]+', 0)}}"
            x: 96
            y: 28
            valign: baseline
            font: regular
            size: 13.87
            color: "#ffffff"
      # IR (Nummer 1 px tiefer)
      - elif: "startsWith(zug1.nr | lower, 'ir')"
        layers:
          - type: image
            file: ir.png
            x: 71
            y: 17
          - type: text
            value: "{{zug1.nr | match('[0-9]+', 0)}}"
            x: 96
            y: 29
            valign: baseline
            font: regular
            size: 13.87
            color: "#ffffff"
          - type: text
            value: "{{zug1.nr | match('[0-9]+', 0)}}"
            x: 96
            y: 29
            valign: baseline
            font: regular
            size: 13.87
            color: "#ffffff"
      # VAE
      - elif: "startsWith(zug1.nr | lower, 'vae')"
        layers:
          - type: image
            file: vae.png
            x: 71
            y: 17
          - type: text
            value: "{{zug1.nr | match('[0-9]+', 0)}}"
            x: 100
            y: 28
            valign: baseline
            font: regular
            size: 13.87
            color: "#ffffff"
          - type: text
            value: "{{zug1.nr | match('[0-9]+', 0)}}"
            x: 100
            y: 28
            valign: baseline
            font: regular
            size: 13.87
            color: "#ffffff"
      # RE: rot auf Weiß
      - elif: "startsWith(zug1.nr | lower, 're')"
        layers:
          - type: rect
            x: 72
            y: 17
            width: 46
            height: 14
            color: "#ffffff"
          - type: text
            value: "RE{{zug1.nr | match('[0-9]+', 0)}}"
            x: 75
            y: 28
            valign: baseline
            font: regular
            size: 14.13
            color: "#ff0000"
          - type: text
            value: "RE{{zug1.nr | match('[0-9]+', 0)}}"
            x: 75
            y: 28
            valign: baseline
            font: regular
            size: 14.13
            color: "#ff0000"
      # S / R: schwarz auf Weiß
      - elif: "or(equals(zug1.nr | match('([a-zA-Z]+)', 1) | lower, 's'), equals(zug1.nr | match('([a-zA-Z]+)', 1) | lower, 'r'))"
        layers:
          - type: rect
            x: 72
            y: 17
            width: 48
            height: 14
            color: "#ffffff"
          - type: text
            value: "{{zug1.nr | match('([a-zA-Z]+)', 1)}}{{zug1.nr | match('[0-9]+', 0)}}"
            x: 74
            y: 29
            valign: baseline
            font: regular
            size: 14.13
            color: "#000000"
          - type: text
            value: "{{zug1.nr | match('([a-zA-Z]+)', 1)}}{{zug1.nr | match('[0-9]+', 0)}}"
            x: 74
            y: 29
            valign: baseline
            font: regular
            size: 14.13
            color: "#000000"
      # PE BEX / PE GEX: kursiv weiß auf Rot, ganze nr
      - elif: "or(equals(zug1.nr | lower, 'pe bex'), equals(zug1.nr | lower, 'pe gex'))"
        layers:
          - type: rect
            x: 65
            y: 17
            width: 53
            height: 14
            color: "#ff0000"
          - type: text
            value: "{{zug1.nr}}"
            x: 67
            y: 28
            valign: baseline
            font: italic
            size: 14.13
            color: "#ffffff"
          - type: text
            value: "{{zug1.nr}}"
            x: 67
            y: 28
            valign: baseline
            font: italic
            size: 14.13
            color: "#ffffff"
      # Fernverkehr ohne eigenes Logo: kursiv weiß auf Rot
      - elif: "not(isEmpty(zug1.nr | match('([a-zA-Z]+)', 1) | upper | match('^(ICE|TGV|PE|BEX|GEX|EC|IC|IR|NJ|RJX|VAE|EXT|CNL)$', 0)))"
        layers:
          - type: rect
            x: 65
            y: 17
            width: 53
            height: 14
            color: "#ff0000"
          - type: text
            value: "{{zug1.nr | match('([a-zA-Z]+)', 1)}}{{zug1.nr | match('[0-9]+', 0)}}"
            x: 67
            y: 29
            valign: baseline
            font: italic
            size: 14.13
            color: "#ffffff"
          - type: text
            value: "{{zug1.nr | match('([a-zA-Z]+)', 1)}}{{zug1.nr | match('[0-9]+', 0)}}"
            x: 67
            y: 29
            valign: baseline
            font: italic
            size: 14.13
            color: "#ffffff"
      # alles andere: nr unverändert
      - else: true
        layers:
          - type: text
            value: "{{zug1.nr}}"
            x: 75
            y: 28
            valign: baseline
            font: regular
            size: 14.67
            color: "#ffffff"
          - type: text
            value: "{{zug1.nr}}"
            x: 75
            y: 28
            valign: baseline
            font: regular
            size: 14.67
            color: "#ffffff"

  # Obere Hälfte in die untere kopieren
  - type: copy
    src_x: 0
    src_y: 0
    src_width: 240
    src_height: 120
    x: 0
    y: 120
