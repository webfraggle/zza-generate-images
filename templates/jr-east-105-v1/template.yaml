meta:
  name: "JR East 1.05\""
  description: "JR East Bahnsteiganzeiger (Japan): Kopfzeile je Gleis, LED-Zeilen im Wechsel Japanisch/Englisch alle 4 Sekunden"
  author: ""
  version: "1.1"
  instructions: |
    Bahnsteiganzeiger im Stil von JR East (Vorbild: Shin-Kiba, Keiyo Line).
    Kopfzeile nach gleis: 1 = Keiyo/Musashino Line for Soga & Nishi-Funabashi,
    2 = Keiyo Line for Tokyo, 3 = Rinkai Line for Osaki; andere Gleise zeigen
    die Gleisnummer und "for <Ziel von Zug 1>".
    LED-Zeilen wechseln alle 4 s zwischen Japanisch und Englisch:
    Zug 1 und 2 mit Gattung (nr: Local, Rapid, Commuter Rapid, Ltd. Express),
    Zeit, Ziel und Wagenzahl (reihung, z.B. "10"); dritte Zeile zeigt den
    Hinweis oder "Zug fährt ein".
    Bekannte Ziele erscheinen in Kanji (Tokyo, Soga, Maihama, Shin-Urayasu,
    Kaihimmakuhari, Nishi-Funabashi, Shin-Matsudo, Fuchu-Hommachi,
    Minami-Funabashi, Shin-Kiba, Kazusa-Ichinomiya, Kimitsu, Osaki, Shinjuku,
    Kawagoe, Omiya, Shin-Narashino, Chiba-Minato), alle anderen lateinisch.
  canvas:
    width: 240
    height: 240
  animation:
    frames: 2
    frame_delay: 4
    loop: true

# Frame 0 = Japanisch, Frame 1 = Englisch (anim.frame).
# Seite A oben, Seite B gespiegelt: Gleisnummer außen (oben x 0-31, unten
# x 208-239), Kopfbild daneben (208x44). LED-Teil y 44-119 wird 1:1 kopiert.
# Farben: Kopf #3c3e41, Gehäuse #1c1c1c, LED-Feld #0c0c0a,
# LED grün #66ee55, orange #ffaa22, rot #ff4433.
# Spalten: Gattung x 8 (max 54), Zeit rechtsbündig bis x 102, Ziel x 108
# (max 67, englisch gestaucht 0.62), Zug-Symbol x 179, Wagenzahl ab x 191.
# Zeilen y 49 / 71 / 93.
# LED-Schrift: DOTMBold (kräftig wie die Kanji).
# Kanji-Bilder: Noto Sans CJK JP (SIL OFL) ohne Kantenglättung gerendert.

fonts:
  - id: dot
    file: DOTMBold.TTF
  - id: regular
    file: NimbusSanL-Reg.otf

layers:
  # ---------- Kopf (y 0-43) ----------
  - type: rect
    x: 0
    y: 0
    width: 240
    height: 44
    color: "#3c3e41"
  - type: text
    value: "{{gleis}}"
    x: 0
    y: 4
    width: 32
    align: center
    font: regular
    size: 36
    scale_x: 0.8
    color: "#d6d6d6"
  - type: image
    if: "equals(gleis, '1')"
    file: hdr-1.png
    x: 32
    y: 0
  - type: image
    elif: "equals(gleis, '2')"
    file: hdr-2.png
    x: 32
    y: 0
  - type: image
    elif: "equals(gleis, '3')"
    file: hdr-3.png
    x: 32
    y: 0
  - type: text
    else: true
    value: "for {{zug1.vonnach}}"
    x: 38
    y: 15
    font: regular
    size: 14
    color: "#e6e6e6"

  # ---------- LED-Teil (y 44-119) ----------
  - type: rect
    x: 0
    y: 44
    width: 240
    height: 76
    color: "#1c1c1c"
  - type: rect
    x: 4
    y: 47
    width: 232
    height: 70
    color: "#0c0c0a"

  # ---------- zug1 (Zeile y 49) ----------
  - if: "not(isEmpty(zug1.zeit))"
    layers:
      - if: "equals(anim.frame, '0')"
        layers:
          - type: image
            if: "contains(zug1.nr | lower | trim, 'commuter')"
            file: typ-commuter.png
            x: 8
            y: 52
          - type: image
            elif: "contains(zug1.nr | lower | trim, 'rapid')"
            file: typ-rapid.png
            x: 8
            y: 52
