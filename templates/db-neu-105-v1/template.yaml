meta:
  name: "DB neu 1.05\""
  description: "Deutsche Bahn, neue Zugzielanzeiger (blau), 240×240px, 1.05 Zoll, Hauptzug außen (2/3) + Folgezug innen (1/3), statische Wagenstandanzeige"
  author: ""
  version: "1.2"
  instructions: |
    Nach dem Vorbild der neuen blauen DB-Anzeiger, geteilt 2/3 : 1/3.
    Hauptzug (zug1) immer außen: Hinweis-Band oben (weiß), Nummer,
    Abfahrtszeit (+ Verspätung), Ziel, Via (max. 2 Zeilen) und eine
    Wagenstandanzeige mit Abschnitten A–F (vorerst statisch, wagenstand.png).
    Folgezug (zug2) immer innen: Nummer, Zeit (+ Verspätung), Ziel, Via.
  canvas:
    width: 240
    height: 240

# Seite A = obere Hälfte (y 0–119), Seite B = untere Hälfte (y 120–239).
# Hauptzug außen: oben links (x 0–158), unten rechts (x 81–239).
# Folgezug innen: oben rechts (x 160–239), unten links (x 0–79).
#
# Aufbau: Zuerst wird in der oberen Hälfte das Layout von Seite B gezeichnet
# (Folgezug x 0–79, Trennlinie x 80, Hauptzug x 81–239). Ein copy setzt es
# unverändert nach unten. Danach holen drei copy-Layer die Blöcke vertauscht
# aus der unteren Hälfte zurück nach oben – so liegt der Hauptzug auf beiden
# Seiten am selben Geräte-Ende.

fonts:
  - id: bold
    file: Roboto-Bold.ttf
  - id: cond
    file: RobotoCondensed-Regular.ttf

layers:
  # ---------- Layout Seite B, zunächst in y 0–119 gezeichnet ----------
  - type: rect
    x: 0
    y: 0
    width: 240
    height: 120
    color: "#1040a0"

  # =============== Folgezug (zug2), x 0–79 ===============
  - type: text
    value: "{{zug2.nr}}"
    x: 4
    y: 16
    font: bold
    size: 10
    color: "#ffffff"

  - type: text
    id: zeit2
    advance: 4
    value: "{{zug2.zeit}}"
    x: 4
    y: 27
    font: bold
    size: 15
    color: "#ffffff"

  - type: text
    if: "greaterThan(zug2.abw, 0)"
    value: "+{{zug2.abw}}"
    x: "{{zeit2.end}}"
    y: 27
    font: bold
    size: 15
    color: "#ffe600"

  # Ziel, bis zu 2 Zeilen (3. Zeile wird vom Deckstreifen verdeckt)
  - type: text
    value: "{{zug2.vonnach}}"
    x: 4
    y: 45
    font: bold
    size: 13
    scale_x: 0.85
    line_height: 0.95
    max_width: 72
    color: "#ffffff"

  - type: rect
    x: 0
    y: 71
    width: 80
    height: 49
    color: "#1040a0"

  # Via, Umbruch bis zum unteren Rand
  - type: text
    value: "{{zug2.via | replace(' - ', ' – ')}}"
    x: 4
    y: 72
    font: cond
    size: 10
    line_height: 0.95
    max_width: 72
    color: "#ffffff"

  # Deckstreifen unten: keine angeschnittene letzte Via-Zeile
  - type: rect
    x: 0
    y: 116
    width: 80
    height: 4
    color: "#1040a0"

  # Trennlinie
  - type: rect
    x: 80
    y: 0
    width: 1
    height: 120
    color: "#ffffff"

  # =============== Hauptzug (zug1), x 81–239 ===============
  # Hinweis-Band (weiß, oben) – nur wenn Hinweis gesetzt
  - type: rect
    if: "not(isEmpty(zug1.hinweis))"
    x: 81
    y: 0
    width: 159
    height: 14
    color: "#ffffff"

  - type: text
    if: "not(isEmpty(zug1.hinweis))"
    value: "{{zug1.hinweis}}"
    x: 86
    y: 1
    font: cond
    size: 11
    scale_x: 0.85
    max_width: 150
    color: "#1040a0"
    fit_items:
      split_by: " "
      gap: 3

  # Zugnummer
  - type: text
    value: "{{zug1.nr}}"
    x: 86
    y: 16
    font: bold
    size: 10
    color: "#ffffff"

  # Abfahrtszeit + Verspätung
  - type: text
    id: zeit
    advance: 6
    value: "{{zug1.zeit}}"
    x: 86
    y: 26
    font: bold
    size: 21
    color: "#ffffff"

  - type: text
    if: "greaterThan(zug1.abw, 0)"
    value: "+{{zug1.abw}}"
    x: "{{zeit.end}}"
    y: 26
    font: bold
    size: 21
    color: "#ffe600"

  # Ziel, einzeilig (Wörter, die nicht passen, entfallen)
  - type: text
    value: "{{zug1.vonnach}}"
    x: 86
    y: 49
    font: bold
    size: 21
    scale_x: 0.75
    max_width: 150
    color: "#ffffff"
    fit_items:
      split_by: " "
      gap: 4

  # Via, Umbruch; ab Zeile 3 vom Deckstreifen verdeckt
  - type: text
    value: "{{zug1.via | replace(' - ', ' – ')}}"
    x: 86
    y: 72
    font: cond
    size: 11
    scale_x: 0.9
    line_height: 0.9
    max_width: 150
    color: "#ffffff"

  # Deckstreifen: schneidet die Via nach 2 Zeilen ab
  - type: rect
    x: 81
    y: 97
    width: 159
    height: 23
    color: "#1040a0"

  # Wagenstandanzeige: Abschnitte A–F über dem Zug (x 86–217) + Zugbild 150×12
  - type: text
    value: "A"
    x: 97
    y: 97
    font: cond
    size: 10
    color: "#ffffff"
    align: center
  - type: text
    value: "B"
    x: 119
    y: 97
    font: cond
    size: 10
    color: "#ffffff"
    align: center
  - type: text
    value: "C"
    x: 141
    y: 97
    font: cond
    size: 10
    color: "#ffffff"
    align: center
  - type: text
    value: "D"
    x: 163
    y: 97
    font: cond
    size: 10
    color: "#ffffff"
    align: center
  - type: text
    value: "E"
    x: 185
    y: 97
    font: cond
    size: 10
    color: "#ffffff"
    align: center
  - type: text
    value: "F"
    x: 207
    y: 97
    font: cond
    size: 10
    color: "#ffffff"
    align: center

  - type: image
    file: wagenstand.png
    x: 86
    y: 107

  # ---------- Seite B = untere Hälfte: Layout unverändert nach unten ----------
  - type: rect
    x: 0
    y: 120
    width: 240
    height: 120
    color: "#1040a0"

  - type: copy
    src_x: 0
    src_y: 0
    src_width: 240
    src_height: 120
    x: 0
    y: 120

  # ---------- Seite A = obere Hälfte: Blöcke vertauscht zurückholen ----------
  # Hauptzug nach außen = oben links (x 81–239 → x 0–158)
  - type: copy
    src_x: 81
    src_y: 120
    src_width: 159
    src_height: 120
    x: 0
    y: 0

  # Trennlinie (x 80 → x 159)
  - type: copy
    src_x: 80
    src_y: 120
    src_width: 1
    src_height: 120
    x: 159
    y: 0

  # Folgezug nach innen = oben rechts (x 0–79 → x 160–239)
  - type: copy
    src_x: 0
    src_y: 120
    src_width: 80
    src_height: 120
    x: 160
    y: 0
