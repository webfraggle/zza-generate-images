meta:
  name: "Worst Case Frame-Modus"
  description: "Lasttest: 125 Frames, Vollbild-Drehung eines 240 × 240-Bildes mit Alpha"
  canvas: {width: 240, height: 240}
  animation:
    frames: 125
    frame_delay: 0.04
    loop: true

fonts:
  - id: reg
    file: NimbusSanL-Reg.otf

layers:
  - {type: rect, color: "#102030", x: 0, y: 0, width: 240, height: 240}
  # Vollbild-Drehung (eine Umdrehung über die 125 Frames)
  - {type: image, file: dial.png, x: 120, y: 120, rotate: "{{anim.frame | mul(2.88)}}"}
  # gegenläufig, dynamisch skaliert
  - {type: image, file: dial.png, x: 120, y: 120, width: "{{240 - anim.frame / 2}}", height: "{{240 - anim.frame / 2}}", rotate: "{{anim.frame | mul(-5)}}"}
  # dynamisch skaliertes Vollbild ohne Drehung
  - {type: image, file: dial.png, x: "{{anim.frame - 60}}", y: 0, width: 240, height: "{{240 - anim.frame / 3}}"}
  - {type: text, value: "{{name}} {{now | format('HH:mm:ss', anim.time)}}", font: reg, size: 18, color: "#ffffff", x: 120, y: 200, align: center}
  - {type: copy, src_x: 60, src_y: 60, src_width: 120, src_height: 40, x: 0, y: 0}
